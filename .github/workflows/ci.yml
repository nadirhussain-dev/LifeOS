name: CI

on:
  pull_request:
  # Pushes to main are checked by release.yml, which calls this workflow before
  # it bumps the version. A `push: branches: [main]` trigger here would run
  # every check twice on the same commit.
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 24, not 20, for `node:sqlite` — database/schema.test.ts executes the
          # app's real bootstrap DDL against it. That test exists because the
          # bootstrap once shipped six statements SQLite refuses to parse and
          # every check here passed anyway; the checks all read the SQL, and
          # none of them ran it.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      # The three token layers (global.css, tailwind.config.js,
      # constants/design-tokens.ts) have to describe the same colours. Nothing
      # catches a mismatch at runtime — a missing Tailwind class renders as no
      # colour at all rather than an error — so it gets checked here.
      - name: Token drift
        run: npm run check:tokens

      # A key used in code but absent from the locales renders as its own path
      # ("settings.goalRemindrs") in the middle of a screen, and a key English
      # has that Arabic does not falls back to English mid-sentence. Neither is
      # visible to tsc, eslint or the bundler. Both were live in this repo when
      # the check was written — the gender step in onboarding had been showing
      # raw key paths since it was built.
      - name: i18n drift
        run: npm run check:i18n

      - name: Test
        run: npm test -- --ci

      # The Supabase migrations are applied by hand against a hosted database,
      # so nothing else would catch a file that fails on first run. These two
      # scripts existed and were never wired in here: `check` reads them,
      # `test:sql` applies them to a real Postgres and asserts that RLS refuses
      # what it should.
      - name: Check migrations
        run: npm run check:migrations

      - name: Test migrations
        run: npm run test:sql
